plugins {
    id 'java'
    alias(libs.plugins.shadow)
}

group = 'io.altessa'
// Overridable from CI: ./gradlew shadowJar -PpluginVersion=1.2.3 (release workflow passes the git tag)
version = findProperty('pluginVersion') ?: '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly libs.keycloakCore
    compileOnly libs.keycloakServerSpi
    compileOnly libs.keycloakServerSpiPrivate
    compileOnly libs.jbossLogging

    implementation libs.jnats

    testImplementation libs.keycloakCore
    testImplementation libs.keycloakServerSpi
    testImplementation libs.keycloakServerSpiPrivate
    testImplementation libs.jbossLogging

    testImplementation libs.junitJupiter
    testRuntimeOnly libs.junitPlatformLauncher
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('kc-nats-listener')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())

    // All provider JARs in Keycloak share one classpath; relocate the shaded
    // jnats so it cannot clash with another provider's copy.
    relocate 'io.nats', 'io.altessa.keycloak.nats.listener.shaded.nats'
}
